# Local development infrastructure. Run from the repo root:
#   npm run infra:up
# Variables are read from the root .env (see .env.example).
name: microfrontend

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ['start-dev', '--import-realm']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?set KEYCLOAK_ADMIN in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HEALTH_ENABLED: 'true'
      KC_HOSTNAME: http://localhost:8080
      # Placeholders substituted into the realm import file
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?set OIDC_CLIENT_SECRET in .env}
      E2E_ALICE_PASSWORD: ${E2E_ALICE_PASSWORD:?set E2E_ALICE_PASSWORD in .env}
      E2E_BOB_PASSWORD: ${E2E_BOB_PASSWORD:?set E2E_BOB_PASSWORD in .env}
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      - ./keycloak/realm-microfrontend.json:/opt/keycloak/data/import/realm-microfrontend.json:ro
    healthcheck:
      # The image has no curl; probe the management port with bash's /dev/tcp.
      test:
        [
          'CMD-SHELL',
          "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
